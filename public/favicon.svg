<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Battery Terminal -->
  <rect x="25" y="8" width="14" height="5" rx="2" fill="#FFFFFF" opacity="0.9"/>

  <!-- Battery Body -->
  <rect x="14" y="13" width="36" height="43" rx="7" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Electric Bolt Charging Symbol -->
  <polygon points="35,17 22,35 32,35 27,51 44,31 34,31" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>

