<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" class="w-full h-full">
  <defs>
    <!-- Background Gradient (High-Tech Violet / Slate) -->
    <linearGradient id="bgF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    
    <!-- MF Battery Gradients -->
    <linearGradient id="batBodyF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="batTopF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Neon Cyber Bolt Gradients -->
    <linearGradient id="boltGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="shadowF" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4338ca" flood-opacity="0.22"/>
    </filter>

    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="magicEyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="240" fill="url(#bgF)"/>

  <!-- Subtle Cyber Tech Grid / Circuit Pattern -->
  <g stroke="#c4b5fd" stroke-width="1" stroke-dasharray="3 4" opacity="0.45">
    <line x1="0" y1="40" x2="500" y2="40"/>
    <line x1="0" y1="80" x2="500" y2="80"/>
    <line x1="0" y1="120" x2="500" y2="120"/>
    <line x1="0" y1="160" x2="500" y2="160"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="400" y1="0" x2="400" y2="240"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="216" rx="165" ry="14" fill="#64748b" opacity="0.3"/>

  <!-- BATTERY MF SEALED CONTAINER -->
  <g filter="url(#shadowF)">
    <!-- Battery Main Body -->
    <rect x="135" y="80" width="230" height="124" rx="14" fill="url(#batBodyF)"/>
    
    <!-- High-Tech Neon Accent Trim -->
    <rect x="135" y="80" width="230" height="4" fill="#8b5cf6"/>

    <!-- Battery Top Cover (Flat Sealed Maintenance Free lid) -->
    <rect x="125" y="62" width="250" height="26" rx="6" fill="url(#batTopF)"/>
    
    <!-- Flush Folding Handle -->
    <rect x="180" y="66" width="140" height="10" rx="5" fill="#334155" stroke="#475569" stroke-width="1"/>

    <!-- Magic Eye Optical Hydrometer Indicator (Green Glow) -->
    <g transform="translate(155, 73)">
      <circle cx="0" cy="0" r="7" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4.5" fill="#10b981" filter="url(#magicEyeGlow)"/>
      <circle cx="-1.5" cy="-1.5" r="1.5" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Terminals Flush Design -->
    <!-- Positive (+) Terminal -->
    <rect x="325" y="46" width="20" height="18" rx="4" fill="#ef4444"/>
    <rect x="331" y="40" width="8" height="6" rx="2" fill="#dc2626"/>
    <text x="335" y="60" font-family="'Inter', sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">+</text>

    <!-- Negative (-) Terminal -->
    <rect x="175" y="46" width="20" height="18" rx="4" fill="#334155"/>
    <rect x="181" y="40" width="8" height="6" rx="2" fill="#1e293b"/>
    <text x="185" y="60" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">-</text>

    <!-- Battery Front Label Badge -->
    <rect x="155" y="108" width="190" height="68" rx="10" fill="#0b0f19" stroke="#6366f1" stroke-width="1"/>
    
    <rect x="159" y="112" width="182" height="14" rx="4" fill="#7c3aed"/>
    <text x="250" y="122" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="1">CALCIUM MF SEALED 12V</text>
    
    <text x="250" y="150" font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">WET - LINE F</text>
    <text x="250" y="167" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="8" fill="#a855f7" text-anchor="middle">HIGH CALCIUM FORMATION</text>
  </g>

  <!-- CHARGING PLUGS & WIRES -->
  <!-- Positive Red Coiled Cable -->
  <path d="M440,24 Q380,26 338,48" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <rect x="332" y="44" width="12" height="12" rx="2" fill="#b91c1c"/>

  <!-- Negative Dark Blue Cable -->
  <path d="M60,24 Q120,26 182,48" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <rect x="178" y="44" width="12" height="12" rx="2" fill="#4338ca"/>

  <!-- NEON CYBER LIGHTNING BOLTS -->
  <!-- Left Bolt (Cyan/Purple) -->
  <polygon points="108,72 82,118 100,118 84,162 128,108 105,108" fill="url(#boltGradF)" filter="url(#glowF)"/>
  
  <!-- Right Bolt (Purple/Pink) -->
  <polygon points="404,74 380,120 398,120 382,160 422,110 401,110" fill="url(#boltGradF)" filter="url(#glowF)"/>

  <!-- Neon Tech Spark Particles -->
  <circle cx="125" cy="55" r="3" fill="#38bdf8"/>
  <circle cx="70" cy="95" r="2.5" fill="#c084fc"/>
  <circle cx="415" cy="60" r="3" fill="#a855f7"/>
  <circle cx="440" cy="125" r="2.5" fill="#38bdf8"/>

  <!-- High-Tech HUD Float Badge -->
  <g transform="translate(375, 140)">
    <rect width="84" height="34" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="42" y="14" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a78bfa" text-anchor="middle">FAST CC/CV</text>
    <text x="42" y="27" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#38bdf8" text-anchor="middle">15.0 A</text>
  </g>
</svg>

