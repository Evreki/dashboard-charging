<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" class="w-full h-full">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    
    <!-- Battery Gradients -->
    <linearGradient id="batBodyA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="batTopA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Lightning Glow -->
    <linearGradient id="boltGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <filter id="shadowA" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>

    <filter id="glowBoltA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="240" fill="url(#bgA)"/>

  <!-- Subtle Tech Grid Lines -->
  <g stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
    <line x1="0" y1="40" x2="500" y2="40"/>
    <line x1="0" y1="80" x2="500" y2="80"/>
    <line x1="0" y1="120" x2="500" y2="120"/>
    <line x1="0" y1="160" x2="500" y2="160"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="400" y1="0" x2="400" y2="240"/>
  </g>

  <!-- Ground / Conveyor Shadow -->
  <ellipse cx="250" cy="216" rx="160" ry="14" fill="#94a3b8" opacity="0.35"/>

  <!-- BATTERY BASE CONTAINER -->
  <g filter="url(#shadowA)">
    <!-- Battery Main Body -->
    <rect x="135" y="82" width="230" height="122" rx="14" fill="url(#batBodyA)"/>
    
    <!-- Cell Grooves (Industrial Ribs) -->
    <g fill="#1e40af" opacity="0.7">
      <rect x="175" y="94" width="6" height="100" rx="3"/>
      <rect x="215" y="94" width="6" height="100" rx="3"/>
      <rect x="250" y="94" width="6" height="100" rx="3"/>
      <rect x="285" y="94" width="6" height="100" rx="3"/>
      <rect x="320" y="94" width="6" height="100" rx="3"/>
    </g>

    <!-- Battery Top Cover -->
    <rect x="125" y="66" width="250" height="24" rx="6" fill="url(#batTopA)"/>
    
    <!-- 6 Cell Vent Caps -->
    <g fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5">
      <circle cx="160" cy="74" r="5"/>
      <circle cx="195" cy="74" r="5"/>
      <circle cx="230" cy="74" r="5"/>
      <circle cx="270" cy="74" r="5"/>
      <circle cx="305" cy="74" r="5"/>
      <circle cx="340" cy="74" r="5"/>
    </g>

    <!-- Positive (+) Terminal (Left) -->
    <rect x="146" y="48" width="18" height="20" rx="4" fill="#ef4444"/>
    <rect x="151" y="42" width="8" height="6" rx="2" fill="#b91c1c"/>
    <text x="155" y="62" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">+</text>

    <!-- Negative (-) Terminal (Right) -->
    <rect x="336" y="48" width="18" height="20" rx="4" fill="#334155"/>
    <rect x="341" y="42" width="8" height="6" rx="2" fill="#0f172a"/>
    <text x="345" y="62" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">-</text>

    <!-- Battery Front Label Badge -->
    <rect x="155" y="112" width="190" height="64" rx="8" fill="#ffffff"/>
    <rect x="158" y="115" width="184" height="12" rx="4" fill="#dc2626"/>
    <text x="250" y="124" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="1">CBI HEAVY DUTY 12V</text>
    <text x="250" y="152" font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="#0f172a" text-anchor="middle">WET - LINE A</text>
    <text x="250" y="167" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="8" fill="#2563eb" text-anchor="middle">LOW ANTIMONY FORMATION</text>
  </g>

  <!-- CHARGING CLAMPS & WIRES -->
  <!-- Red Cable & Clamp Left -->
  <path d="M60,20 Q110,30 148,52" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <rect x="140" y="46" width="12" height="14" rx="2" fill="#b91c1c"/>

  <!-- Black Cable & Clamp Right -->
  <path d="M440,20 Q390,30 350,52" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <rect x="346" y="46" width="12" height="14" rx="2" fill="#020617"/>

  <!-- CARTOON SPARKS & LIGHTNING BOLTS -->
  <!-- Left Big Bolt -->
  <polygon points="105,75 80,120 98,120 82,165 125,110 102,110" fill="url(#boltGradA)" stroke="#ca8a04" stroke-width="1.5" filter="url(#glowBoltA)"/>
  
  <!-- Right Big Bolt -->
  <polygon points="405,80 380,122 398,122 384,162 422,112 402,112" fill="url(#boltGradA)" stroke="#ca8a04" stroke-width="1.5" filter="url(#glowBoltA)"/>

  <!-- Mini Energy Sparks -->
  <circle cx="118" cy="60" r="3" fill="#facc15"/>
  <circle cx="75" cy="100" r="2" fill="#facc15"/>
  <circle cx="410" cy="65" r="3" fill="#facc15"/>
  <circle cx="435" cy="130" r="2.5" fill="#facc15"/>

  <!-- Voltage / Current Badge Floating -->
  <g transform="translate(45, 140)">
    <rect width="78" height="34" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="39" y="14" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" text-anchor="middle">CHARGING</text>
    <text x="39" y="27" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#1d4ed8" text-anchor="middle">12.5 A</text>
  </g>
</svg>

